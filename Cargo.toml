[package]
name = "inspect-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "inspect"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
colored = "2"
regex = "1"
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
